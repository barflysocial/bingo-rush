<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070914"><title>Bingo Rush QR Display</title><link rel="stylesheet" href="/styles.css?v=1.5.1"></head>
<body class="qr-display-body">
  <button id="qrFullscreenBtn" class="qr-fullscreen-toggle" type="button">FULL SCREEN</button>
  <main id="qrDisplayViewport" class="qr-display-viewport">
    <section id="qrDisplayStage" class="qr-stage qr-stage-full" aria-label="Bingo Rush join screen">
      <div class="qr-stage-left"><img src="/assets/bingo-rush-title.png" alt="Bingo Rush" class="qr-title-art"><div id="qrSponsorFull" class="qr-sponsor-line"></div></div>
      <div class="qr-stage-right"><div class="qr-scan-label">SCAN TO JOIN</div><div class="qr-box"><img id="qrFullImage" alt="Game QR code"></div><div class="qr-or">OR ENTER GAME CODE</div><div id="qrFullCode" class="qr-display-code">—</div><div id="qrFullUrl" class="qr-join-url"></div></div>
    </section>
  </main>
<script>
const qs=new URLSearchParams(location.search);const code=String(qs.get('code')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,15);
const stage=document.getElementById('qrDisplayStage');const viewport=document.getElementById('qrDisplayViewport');let source=null,currentRound=0;
function fit(){const scale=Math.min(window.innerWidth/1920,window.innerHeight/1080);stage.style.transform=`scale(${scale})`;viewport.style.width=(1920*scale)+'px';viewport.style.height=(1080*scale)+'px';}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderState(s){currentRound=s.roundNumber||1;document.getElementById('qrFullCode').textContent=code;document.getElementById('qrFullUrl').textContent=location.host;document.getElementById('qrFullImage').src=`/api/sessions/${encodeURIComponent(code)}/qr.svg?r=${currentRound}&v=${Date.now()}`;const sp=document.getElementById('qrSponsorFull');if(s.sponsorName||s.sponsorLogoUrl){sp.innerHTML=`<span>THIS ROUND'S GAME IS SPONSORED BY</span>${s.sponsorName?`<b>${esc(s.sponsorName)}</b>`:''}${s.sponsorLogoUrl?`<img src="${esc(s.sponsorLogoUrl)}" alt="Sponsor logo">`:''}`;sp.classList.remove('hidden')}else{sp.classList.add('hidden');sp.innerHTML=''}document.title=`Bingo Rush • ${code}`;}
document.getElementById('qrFullscreenBtn').addEventListener('click',async()=>{try{if(!document.fullscreenElement){await document.documentElement.requestFullscreen();document.getElementById('qrFullscreenBtn').textContent='EXIT FULL SCREEN'}else{await document.exitFullscreen();document.getElementById('qrFullscreenBtn').textContent='FULL SCREEN'}}catch{}});document.addEventListener('fullscreenchange',()=>{document.getElementById('qrFullscreenBtn').textContent=document.fullscreenElement?'EXIT FULL SCREEN':'FULL SCREEN';fit()});
async function init(){fit();window.addEventListener('resize',fit);if(!code){document.getElementById('qrFullCode').textContent='NO CODE';return;}try{const r=await fetch('/api/sessions/'+encodeURIComponent(code),{cache:'no-store'});const s=await r.json();if(!r.ok)throw new Error(s.error||'Game not found');renderState(s);source=new EventSource('/events?session='+encodeURIComponent(code));source.addEventListener('state',e=>renderState(JSON.parse(e.data)));source.addEventListener('room_reset',()=>{document.getElementById('qrFullCode').textContent='ROOM RESET';document.getElementById('qrFullImage').removeAttribute('src');document.getElementById('qrSponsorFull').classList.add('hidden');if(source)source.close()});}catch(e){document.getElementById('qrFullCode').textContent='GAME NOT FOUND';}}
init();
</script></body></html>
