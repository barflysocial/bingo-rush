<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070914"><title>Bingo Rush QR Display</title><link rel="stylesheet" href="/styles.css?v=1.6.14"></head>
<body class="qr-display-body">
  <button id="qrFullscreenBtn" class="qr-fullscreen-toggle" type="button">FULL SCREEN</button>
  <main id="qrDisplayViewport" class="qr-display-viewport">
    <section id="qrDisplayStage" class="qr-stage qr-stage-full" aria-label="Bingo Rush join screen">
      <img src="/assets/bingo-rush-qr-display-bg.png" alt="Neon game background" class="qr-bg-art">
      <div class="qr-overlay"><div class="qr-box"><img id="qrFullImage" alt="Game QR code"></div></div>
    </section>
  </main>
<script>
const qs=new URLSearchParams(location.search);const code=String(qs.get('code')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,15);
const stage=document.getElementById('qrDisplayStage');const viewport=document.getElementById('qrDisplayViewport');let source=null,currentRound=0;
function fit(){const scale=Math.min(window.innerWidth/1920,window.innerHeight/1080);stage.style.transform=`scale(${scale})`;viewport.style.width=(1920*scale)+'px';viewport.style.height=(1080*scale)+'px';}
function renderState(s){currentRound=s.roundNumber||1;document.getElementById('qrFullImage').src=`/api/sessions/${encodeURIComponent(code)}/qr.svg?r=${currentRound}&v=${Date.now()}`;document.title=`Bingo Rush • ${code}`;}
document.getElementById('qrFullscreenBtn').addEventListener('click',async()=>{try{if(!document.fullscreenElement){await document.documentElement.requestFullscreen();document.getElementById('qrFullscreenBtn').textContent='EXIT FULL SCREEN'}else{await document.exitFullscreen();document.getElementById('qrFullscreenBtn').textContent='FULL SCREEN'}}catch{}});document.addEventListener('fullscreenchange',()=>{document.getElementById('qrFullscreenBtn').textContent=document.fullscreenElement?'EXIT FULL SCREEN':'FULL SCREEN';fit()});
async function init(){fit();window.addEventListener('resize',fit);if(!code){document.getElementById('qrFullImage').removeAttribute('src');return;}try{const r=await fetch('/api/sessions/'+encodeURIComponent(code),{cache:'no-store'});const state=await r.json();if(!r.ok)throw new Error(state.error||'Game not found');renderState(state);source=new EventSource('/events?session='+encodeURIComponent(code));source.addEventListener('state',e=>renderState(JSON.parse(e.data)));source.addEventListener('room_reset',()=>{document.getElementById('qrFullImage').removeAttribute('src');if(source)source.close()});}catch(e){document.getElementById('qrFullImage').removeAttribute('src');}}
init();
</script></body></html>
